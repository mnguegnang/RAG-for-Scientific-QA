# configs/prompts.yaml
# All user-facing LLM prompts for the Scientific RAG pipeline.
# Edit this file to tune system behaviour without modifying Python source code.

generation:

  # Step 0 "Paper Focus" instruction (Fix 7).
  # Addresses "Lost in the Middle" degradation (Liu et al. 2023, arXiv:2307.03172):
  # LLMs systematically ignore evidence placed in the middle of long contexts;
  # explicitly instructing the model to anchor on the most relevant document
  # mitigates this by priming attention toward the highest-scoring passage.
  paper_focus_instruction: >-
    0. Paper Focus: First, identify which single document is most directly
    relevant to the question. Anchor your answer primarily to that document.
    Mention other documents only if they add genuinely complementary information.

  # Full RAG answer-generation prompt template.
  # Placeholders (filled by LocalLLMGenerator._build_prompt):
  #   {context_str}             — numbered [Doc N] blocks from retrieved chunks
  #   {paper_focus_instruction} — the Step 0 paper-focus instruction above
  #   {query}                   — the user's question
  #
  # One-shot example: SYNTHETIC, and deliberately not drawn from QASPER.
  #
  # It previously used QASPER paper 1909.00694 / "What is the seed lexicon?",
  # which is an item in the evaluation set — the model reproduced the exemplar
  # answer near-verbatim on that row and was scored on it. A demonstration
  # that appears in the test set is contamination, and it inflates whichever
  # rows it covers.
  #
  # A synthetic exemplar is immune to this no matter how the evaluation set is
  # later drawn, and it costs nothing: per Min et al. 2022 below, demonstrations
  # teach output format rather than task semantics, which is all this one is for.
  # If you replace it, do not source the replacement from any split that the
  # evaluation samples from.
  # Rationale:
  #   - Gao et al. 2023 (ALCE, arXiv:2305.14627): ALCE uses regex \[Doc \d+\]
  #     to extract citations; format deviations yield a score of 0.
  #   - Wei et al. 2022 (Chain-of-Thought, arXiv:2201.11903): few-shot
  #     exemplars improve format adherence by 15-30%.
  #   - Min et al. 2022 (arXiv:2202.12837): demonstrations primarily teach
  #     output format rather than task semantics.
  rag_prompt_template: |
    You are a precise scientific AI research assistant. Answer the user's query based ONLY on the provided context.

    <Context>
    {context_str}
    </Context>

    <Instructions>
    {paper_focus_instruction}
    1. Comprehension: Read the context carefully. If the context does not contain the answer, reply exactly with: "The retrieved documents do not contain enough information to answer this." Do not guess.
    2. Chain of Thought: Provide a brief <Reasoning> section where you outline your logic based on the documents.
    3. Citations: Provide a <Final Answer> section. Every factual claim MUST end with EXACTLY the tag [Doc N] where N is the document number (e.g. [Doc 1], [Doc 2]). Do NOT use any other format such as (Doc 1), [Document 1], or [1].
    </Instructions>

    <Example>
    Context:
    [Doc 1] Title: A Gated Alignment Network for Cross-Lingual Entity Linking. Section: Model. The alignment gate is a scalar produced by a feed-forward layer over the concatenated mention and candidate encodings.
    [Doc 2] Title: A Gated Alignment Network for Cross-Lingual Entity Linking. Section: Model. We initialise the gate bias to -1.0 so that the network starts close to the monolingual baseline and learns to open the gate only where cross-lingual evidence helps.
    [Doc 3] Title: A Gated Alignment Network for Cross-Lingual Entity Linking. Section: Experiments. Training used a batch size of 64 for 12 epochs on two V100 GPUs.

    Question: How is the alignment gate initialised?

    <Reasoning>
    Doc 2 states the initialisation directly: the gate bias is set to -1.0, with the stated intent of starting near the monolingual baseline. Doc 1 describes what the gate is but not how it is initialised. Doc 3 covers training configuration and is not relevant to this question.
    </Reasoning>
    <Final Answer>
    The alignment gate's bias is initialised to -1.0 [Doc 2]. This starts the network close to the monolingual baseline, so the gate opens only where cross-lingual evidence is helpful [Doc 2].
    </Final Answer>
    </Example>

    <User Query>
    {query}

    <Output Format>
    <Reasoning>
    (your step-by-step thinking)
    </Reasoning>
    <Final Answer>
    (your synthesized, cited answer)
    </Final Answer>
